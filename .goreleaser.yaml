version: 2

project_name: leanport

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: leanport
    main: ./cmd/leanport
    binary: leanport
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: shrsv
    name: LeanPort
  draft: false
  prerelease: auto
